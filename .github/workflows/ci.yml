name: Django CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services: {}
    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install Django django-parler Pillow
          fi

      - name: Install test tooling (coverage, pytest, codecov)
        run: |
          pip install --upgrade pip
          pip install coverage pytest pytest-django
          pip install codecov || true

      - name: Install pre-commit and run hooks
        run: |
          pip install --user pre-commit
          python -m pip install pre-commit
          pre-commit run --all-files

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: lawyer_site.settings_ci
        run: |
          python manage.py migrate --noinput

      - name: Run smoke tests (fast)
        env:
          DJANGO_SETTINGS_MODULE: lawyer_site.settings_ci
        run: |
          # Run a focused smoke test suite if defined, otherwise fallback to a small known test
          if [ -f tests_smoke.txt ]; then
            xargs -a tests_smoke.txt -n 1 python -m pytest -q || true
          else
            python manage.py test core.tests.test_smoke_quick || true
          fi

      - name: Run full tests under coverage and capture output
        env:
          DJANGO_SETTINGS_MODULE: lawyer_site.settings_ci
        run: |
          set -o pipefail || true
          coverage run --source='.' manage.py test --verbosity=2 2>&1 | tee test_results.txt
          coverage xml -o coverage.xml || true
          coverage html -d htmlcov || true

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/**

      - name: Try uploading coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        run: |
          codecov -t ${{ secrets.CODECOV_TOKEN }} || true

      - name: Cleanup CI media directory
        if: always()
        run: |
          python - <<'PY'
import shutil, pathlib
p = pathlib.Path('ci_media')
if p.exists() and p.is_dir():
    shutil.rmtree(p)
print('ci_media cleaned')
PY

  postgres-test:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pre-commit and run hooks
        run: |
          pip install --user pre-commit
          python -m pip install pre-commit
          pre-commit run --all-files

      - name: Run tests against Postgres
        env:
          DJANGO_SETTINGS_MODULE: lawyer_site.settings_ci
          CI_USE_POSTGRES: '1'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python manage.py migrate --noinput
          python manage.py test --verbosity=2
