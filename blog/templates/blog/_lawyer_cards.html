{% load static %}
<div class="lawyer-cards" style="display:flex;flex-wrap:wrap;gap:16px;">
  {% for lawyer in lawyers %}
    <article class="lawyer-card post-card fade-in-up" style="flex:1 1 320px;display:flex;flex-direction:column;overflow:hidden;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;">
      <a href="{% url 'blog:lawyer_detail' lawyer.pk %}" aria-label="{{ lawyer.name }}" style="color:inherit;text-decoration:none;display:block;">
      <div class="lawyer-media" style="width:100%;background:linear-gradient(180deg, var(--card-bg), color-mix(in srgb, var(--card-bg) 90%, var(--bg) 10%));">
        {% if lawyer.image %}
          <img src="{{ lawyer.image.url }}" alt="{{ lawyer.name }}" loading="lazy" style="width:100%;height:auto;object-fit:contain;border-top-left-radius:8px;border-top-right-radius:8px;display:block;">
        {% else %}
          <div style="width:100%;min-height:140px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, color-mix(in srgb, var(--card-bg) 92%, var(--bg) 8%), color-mix(in srgb, var(--card-bg) 84%, var(--bg) 16%));color:var(--muted-text);font-weight:700;">
            محامية
          </div>
        {% endif %}
      </div>
      <div class="lawyer-body" style="padding:14px;display:flex;flex-direction:column;justify-content:center;gap:6px;">
        <h3 class="lawyer-name" style="margin:0 0 6px 0;font-size:1.07rem;color:var(--text);">{{ lawyer.name }}</h3>
        <p class="lawyer-bio" style="margin:0;color:var(--muted-text);font-size:0.96rem;line-height:1.5;">{{ lawyer.bio }}</p>
      </div>
      </a>
    </article>
  {% empty %}
    <p>لا توجد بطاقات محامين مفعلة بعد.</p>
  {% endfor %}
</div>
